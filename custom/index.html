<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>Custom Printing — Third Eye Print Co.</title><meta name="description" content="Request signs, tents, decals, menus, banners, and other custom printing."><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/app.css"><script src="/config.js"></script></head><body><div class="shell"><header class="top"><a class="back" href="/">← Back</a><a class="brand" href="/"><img src="/favicon.svg" alt=""><span>Third Eye Print Co.</span></a><span class="spacer"></span></header><main><div><h1>Other printing</h1><p>Signs, tents, decals, menus, banners, and custom jobs.</p></div><section class="panel grid"><label class="field"><span>What do you need?</span><select id="kind"><option>Signs</option><option>Event tents</option><option>Decals / stickers</option><option>Menus</option><option>Banners</option><option>Other</option></select></label><label class="field"><span>Details</span><textarea id="details" placeholder="Quantity, size, deadline, and anything else you know."></textarea></label><button class="button primary full" id="request">Email request</button></section><div class="status" id="status"></div></main></div><script>const runtime=window.THIRD_EYE_CONFIG||{};document.getElementById('request').onclick=()=>{const k=document.getElementById('kind').value,d=document.getElementById('details').value.trim(),email=runtime.quoteEmailTo||'gamboaesai@gmail.com';const subject=`Print request - ${k}`;const body=['Hi Third Eye Print Co.,','',`I need: ${k}`,`Details: ${d||'I would like help figuring out the specs.'}`,''].join('\n');location.href=`mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`};</script></body></html>
