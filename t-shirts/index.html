<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>T-shirts — Third Eye Print Co.</title><meta name="description" content="Request T-shirt and apparel printing from Third Eye Print Co."><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/app.css"><script src="/config.js"></script></head><body><div class="shell"><header class="top"><a class="back" href="/">← Back</a><a class="brand" href="/"><img src="/favicon.svg" alt=""><span>Third Eye Print Co.</span></a><span class="spacer"></span></header><main><div><h1>T-shirts</h1><p>Tell us the basics. We’ll price the right garment and print method.</p></div><section class="panel grid"><label class="field"><span>Quantity</span><input id="quantity" type="number" min="1" inputmode="numeric" placeholder="How many shirts?"></label><label class="field"><span>Details · optional</span><textarea id="details" placeholder="Sizes, shirt style, print locations, colors, deadline…"></textarea></label><button class="button primary full" id="request">Email request</button></section><div class="status" id="status"></div></main></div><script>const runtime=window.THIRD_EYE_CONFIG||{};document.getElementById('request').onclick=()=>{const q=document.getElementById('quantity').value.trim(),d=document.getElementById('details').value.trim(),email=runtime.quoteEmailTo||'gamboaesai@gmail.com';const subject='T-shirt print request';const body=['Hi Third Eye Print Co.,','','I need T-shirts printed.',`Quantity: ${q||'Not sure yet'}`,`Details: ${d||'None yet'}`,''].join('\n');location.href=`mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`};</script></body></html>
